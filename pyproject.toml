[project]
name = "train-track-grpo"
version = "0.1.0"
description = "Code-as-action GRPO for Train Tracks puzzles with Gemma 4 E2B"
readme = "plan.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=11.0",
    "pyarrow>=26.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
